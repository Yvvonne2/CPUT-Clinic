<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctor Dashboard | CPUT Clinic</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }

    header {
      background: #0066cc;
      color: white;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .container {
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    h2 {
      color: #333;
      border-bottom: 2px solid #0066cc;
      padding-bottom: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #0066cc;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    footer {
      background: #333;
      color: #ccc;
      text-align: center;
      padding: 10px;
      margin-top: 30px;
      font-size: 14px;
    }

    input[type="text"] {
      padding: 10px;
      width: 300px;
      border: 1px solid #ccc;
      border-radius: 5px;
      margin-bottom: 15px;
    }

    .logout-btn {
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #e63939;
    }
  </style>
</head>
<body>
  <header>
    <h1>Doctor Dashboard</h1>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>

  <div class="container">
    <h2>Registered Patients</h2>
    <input type="text" id="search" placeholder="Search patients by name or ID number..." />

    <table id="patientsTable">
      <thead>
        <tr>
          <th>ID</th>
          <th>Full Name</th>
          <th>ID Number</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="3">Loading patients...</td></tr>
      </tbody>
    </table>
  </div>

  <footer>
    <p>&copy; 2025 CPUT Campus Clinic System | All rights reserved</p>
  </footer>

  <script>
    let patients = [];

    document.addEventListener('DOMContentLoaded', function() {
      fetchPatients();
      document.getElementById('search').addEventListener('input', filterPatients);
    });

    function fetchPatients() {
      fetch('getPatients.php')
        .then(response => response.json())
        .then(data => {
          patients = data;
          renderPatients(patients);
        })
        .catch(error => {
          console.error('Error fetching patients:', error);
          document.querySelector('#patientsTable tbody').innerHTML =
            '<tr><td colspan="3">Failed to load data.</td></tr>';
        });
    }

    function renderPatients(data) {
      const tbody = document.querySelector('#patientsTable tbody');
      tbody.innerHTML = '';

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3">No patients found.</td></tr>';
        return;
      }

      data.forEach(p => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.id}</td>
          <td>${p.name}</td>
          <td>${p.idNumber}</td>
        `;
        tbody.appendChild(row);
      });
    }

    function filterPatients(e) {
      const query = e.target.value.toLowerCase();
      const filtered = patients.filter(p =>
        p.name.toLowerCase().includes(query) ||
        p.idNumber.includes(query)
      );
      renderPatients(filtered);
    }

    function logout() {
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
